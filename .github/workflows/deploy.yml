name: Build & Deploy to VPS

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      has_builds: ${{ steps.matrix.outputs.has_builds }}
      service_names: ${{ steps.matrix.outputs.service_names }}
      deploy_all: ${{ steps.matrix.outputs.deploy_all }}
      reload_nginx: ${{ steps.matrix.outputs.reload_nginx }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            CHANGED_FILES="$(git ls-files)"
          else
            CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          has_change() {
            local pattern="$1"
            echo "$CHANGED_FILES" | grep -Eq "$pattern"
          }

          matrix='{"include":[]}'
          has_builds=false
          deploy_all=false
          reload_nginx=false
          declare -a services=()

          add_service() {
            local service_name="$1"
            local image_name="$2"
            local context="$3"
            local file="$4"
            local cache_scope="$5"
            local build_args="${6:-}"

            if [[ -n "$build_args" ]]; then
              item=$(printf '{"image_name":"%s","context":"%s","file":"%s","cache_scope":"%s","build_args":"%s"}' \
                "$image_name" "$context" "$file" "$cache_scope" "$build_args")
            else
              item=$(printf '{"image_name":"%s","context":"%s","file":"%s","cache_scope":"%s"}' \
                "$image_name" "$context" "$file" "$cache_scope")
            fi

            matrix=$(jq -c --argjson item "$item" '.include += [$item]' <<< "$matrix")
            services+=("$service_name")
            has_builds=true
          }

          if has_change '^backend/docker-compose\.yml$'; then
            deploy_all=true
          fi

          if has_change '^backend/docker/nginx/'; then
            reload_nginx=true
          fi

          if has_change '^backend/DotNet/(IdentityTest|ClassLibrary)/'; then
            add_service 'identity-server' 'hits-patterns-identity-server' './backend/DotNet' './backend/DotNet/IdentityTest/Dockerfile' 'identity-server'
          fi

          if has_change '^backend/DotNet/(patternsUsers|ClassLibrary)/'; then
            add_service 'patterns-users' 'hits-patterns-patterns-users' './backend/DotNet' './backend/DotNet/patternsUsers/Dockerfile' 'patterns-users'
          fi

          if has_change '^backend/DotNet/(patternsUserSetting|ClassLibrary)/'; then
            add_service 'patterns-user-setting' 'hits-patterns-patterns-user-setting' './backend/DotNet' './backend/DotNet/patternsUserSetting/Dockerfile' 'patterns-user-setting'
          fi

          if has_change '^backend/money-services/(account|shared|build.gradle|settings.gradle|gradlew|gradlew.bat|Dockerfile|gradle/)'; then
            add_service 'account-service' 'hits-patterns-account-service' './backend/money-services' './backend/money-services/Dockerfile' 'account-service' 'SERVICE_NAME=account'
          fi

          if has_change '^backend/money-services/(credit|shared|build.gradle|settings.gradle|gradlew|gradlew.bat|Dockerfile|gradle/)'; then
            add_service 'credit-service' 'hits-patterns-credit-service' './backend/money-services' './backend/money-services/Dockerfile' 'credit-service' 'SERVICE_NAME=credit'
          fi

          if has_change '^backend/money-services/(transfers|shared|build.gradle|settings.gradle|gradlew|gradlew.bat|Dockerfile|gradle/)'; then
            add_service 'transfers-service' 'hits-patterns-transfers-service' './backend/money-services' './backend/money-services/Dockerfile' 'transfers-service' 'SERVICE_NAME=transfers'
          fi

          if has_change '^backend/money-services/(currency|shared|build.gradle|settings.gradle|gradlew|gradlew.bat|Dockerfile|gradle/)'; then
            add_service 'currency-service' 'hits-patterns-currency-service' './backend/money-services' './backend/money-services/Dockerfile' 'currency-service' 'SERVICE_NAME=currency'
          fi

          if has_change '^backend/money-services/(patterns-gateway|build.gradle|settings.gradle|gradlew|gradlew.bat|Dockerfile|gradle/)'; then
            add_service 'patterns-gateway' 'hits-patterns-patterns-gateway' './backend/money-services' './backend/money-services/Dockerfile' 'patterns-gateway' 'SERVICE_NAME=patterns-gateway'
          fi

          service_names="${services[*]}"

          echo "build_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_builds=$has_builds" >> "$GITHUB_OUTPUT"
          echo "service_names=$service_names" >> "$GITHUB_OUTPUT"
          echo "deploy_all=$deploy_all" >> "$GITHUB_OUTPUT"
          echo "reload_nginx=$reload_nginx" >> "$GITHUB_OUTPUT"

  build_and_push:
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect_changes.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args || '' }}
          tags: |
            ghcr.io/pineapplleboy/${{ matrix.image_name }}:latest
            ghcr.io/pineapplleboy/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: false
          sbom: false

  deploy:
    runs-on: ubuntu-latest
    needs: [detect_changes, build_and_push]
    if: always() && needs.detect_changes.result == 'success' && (needs.build_and_push.result == 'success' || needs.build_and_push.result == 'skipped')
    steps:
      - name: Setup SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy updated services
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_BUILDS: ${{ needs.detect_changes.outputs.has_builds }}
          SERVICE_NAMES: ${{ needs.detect_changes.outputs.service_names }}
          DEPLOY_ALL: ${{ needs.detect_changes.outputs.deploy_all }}
          RELOAD_NGINX: ${{ needs.detect_changes.outputs.reload_nginx }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' HAS_BUILDS='$HAS_BUILDS' SERVICE_NAMES='$SERVICE_NAMES' DEPLOY_ALL='$DEPLOY_ALL' RELOAD_NGINX='$RELOAD_NGINX' bash -s" <<'EOF'
          set -e
          flock -n -E 42 /tmp/deploy.lock bash -lc '
            set -e
            cd /home/deploy/patterns/hits-patterns
            git pull origin main
            cd backend

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            if [ "$DEPLOY_ALL" = "true" ]; then
              echo "Reconciling full stack"
              if [ "$HAS_BUILDS" = "true" ] && [ -n "$SERVICE_NAMES" ]; then
                docker compose pull $SERVICE_NAMES
              fi
              docker compose up -d --remove-orphans
            elif [ -n "$SERVICE_NAMES" ]; then
              echo "Deploying services: $SERVICE_NAMES"
              docker compose pull $SERVICE_NAMES
              docker compose up -d --remove-orphans $SERVICE_NAMES
            else
              echo "No backend service changes detected. Skipping docker compose pull/up."
            fi

            if [ "$RELOAD_NGINX" = "true" ]; then
              echo "Reloading nginx config"
              sudo install -m 644 docker/nginx/patterns-gateway.conf /etc/nginx/conf.d/patterns-gateway.conf
              sudo nginx -t
              sudo systemctl reload nginx
            fi
          '
          status=$?
          if [ "$status" -eq 42 ]; then
            echo "Another deploy is already running (lock /tmp/deploy.lock)."
          fi
          exit "$status"
          EOF
