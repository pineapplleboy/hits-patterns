services:
  postgres:
    image: postgres:16-alpine
    container_name: patterns-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 400m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: patterns-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx128m"
    restart: unless-stopped
    mem_limit: 180m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: patterns-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped
    mem_limit: 750m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: patterns-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"
    mem_limit: 200m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  identity-server:
    image: ghcr.io/pineapplleboy/hits-patterns-identity-server:latest
    container_name: identity-server
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=testIdentity;Username=postgres;Password=postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SWAGGER_USERS_URL: http://91.227.18.176/users
      SWAGGER_USER_SETTINGS_URL: http://91.227.18.176/settings
      SWAGGER_ACCOUNT_URL: http://91.227.18.176/core
      SWAGGER_TRANSFERS_URL: http://91.227.18.176/transfers
      SWAGGER_CURRENCY_URL: http://91.227.18.176/currency
      SWAGGER_CREDIT_URL: http://91.227.18.176/credit
      SWAGGER_MONITORING_URL: http://91.227.18.176/monitoring
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
    mem_limit: 350m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  patterns-users:
    image: ghcr.io/pineapplleboy/hits-patterns-patterns-users:latest
    container_name: patterns-users
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DbConnection: Host=postgres;Port=5432;Database=patternsUsers;Username=postgres;Password=postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      Auth__Authority: http://identity-server:5001
      Auth__RequireHttpsMetadata: "false"
      Swagger__OAuth__ClientId: api_swagger_users
      Swagger__OAuth__AuthorizationUrl: http://91.227.18.176/identity/connect/authorize
      Swagger__OAuth__TokenUrl: http://91.227.18.176/identity/connect/token
      Swagger__OAuth__RedirectUrl: http://91.227.18.176/users/swagger/oauth2-redirect.html
      Swagger__OAuth__Scope: SampleAPI
      Swagger__OAuth__ScopeDescription: Sample API - full access
    ports:
      - "127.0.0.1:5229:8080"
    restart: unless-stopped
    mem_limit: 250m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  patterns-user-setting:
    image: ghcr.io/pineapplleboy/hits-patterns-patterns-user-setting:latest
    container_name: patterns-user-setting
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DbConnection: Host=postgres;Port=5432;Database=patternsUserSetting;Username=postgres;Password=postgres
      Auth__Authority: http://identity-server:5001
      Auth__RequireHttpsMetadata: "false"
      Swagger__OAuth__ClientId: api_swagger_settings
      Swagger__OAuth__AuthorizationUrl: http://91.227.18.176/identity/connect/authorize
      Swagger__OAuth__TokenUrl: http://91.227.18.176/identity/connect/token
      Swagger__OAuth__RedirectUrl: http://91.227.18.176/settings/swagger/oauth2-redirect.html
      Swagger__OAuth__Scope: SampleAPI
      Swagger__OAuth__ScopeDescription: Sample API - full access
    ports:
      - "127.0.0.1:5176:8080"
    restart: unless-stopped
    mem_limit: 250m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  account-service:
    image: ghcr.io/pineapplleboy/hits-patterns-account-service:latest
    container_name: account-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patterns_core_account
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KAFKA_URL: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWKS_URL: http://identity-server:5001/.well-known/openid-configuration/jwks
      SWAGGER_CLIENT_ID: api_swagger_account
      SWAGGER_AUTHORIZATION_URL: http://91.227.18.176/identity/connect/authorize
      SWAGGER_TOKEN_URL: http://91.227.18.176/identity/connect/token
      SWAGGER_OAUTH2_REDIRECT_URL: http://91.227.18.176/core/swagger-ui/oauth2-redirect.html
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped
    mem_limit: 450m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  credit-service:
    image: ghcr.io/pineapplleboy/hits-patterns-credit-service:latest
    container_name: credit-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patterns_credit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_TAKE_CREDIT_TOPIC: 00_take_credit
      AUTH_JWKS_URL: http://identity-server:5001/.well-known/openid-configuration/jwks
      SWAGGER_CLIENT_ID: api_swagger_credit
      SWAGGER_AUTHORIZATION_URL: http://91.227.18.176/identity/connect/authorize
      SWAGGER_TOKEN_URL: http://91.227.18.176/identity/connect/token
      SWAGGER_OAUTH2_REDIRECT_URL: http://91.227.18.176/credit/swagger-ui/oauth2-redirect.html
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx300m"
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    mem_limit: 400m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  transfers-service:
    image: ghcr.io/pineapplleboy/hits-patterns-transfers-service:latest
    container_name: transfers-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_URL: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWKS_URL: http://identity-server:5001/.well-known/openid-configuration/jwks
      SWAGGER_CLIENT_ID: api_swagger_transfers
      SWAGGER_AUTHORIZATION_URL: http://91.227.18.176/identity/connect/authorize
      SWAGGER_TOKEN_URL: http://91.227.18.176/identity/connect/token
      SWAGGER_OAUTH2_REDIRECT_URL: http://91.227.18.176/transfers/swagger-ui/oauth2-redirect.html
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx250m"
    ports:
      - "127.0.0.1:8083:8083"
    restart: unless-stopped
    mem_limit: 320m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  currency-service:
    image: ghcr.io/pineapplleboy/hits-patterns-currency-service:latest
    container_name: currency-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patterns_currency
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KAFKA_URL: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWKS_URL: http://identity-server:5001/.well-known/openid-configuration/jwks
      SWAGGER_CLIENT_ID: api_swagger_currency
      SWAGGER_AUTHORIZATION_URL: http://91.227.18.176/identity/connect/authorize
      SWAGGER_TOKEN_URL: http://91.227.18.176/identity/connect/token
      SWAGGER_OAUTH2_REDIRECT_URL: http://91.227.18.176/currency/swagger-ui/oauth2-redirect.html
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx300m"
    ports:
      - "127.0.0.1:8084:8084"
    restart: unless-stopped
    mem_limit: 400m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  monitoring-service:
    image: ghcr.io/pineapplleboy/hits-patterns-monitoring-service:latest
    container_name: monitoring-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patterns_monitoring
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KAFKA_URL: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWKS_URL: http://identity-server:5001/.well-known/openid-configuration/jwks
      SWAGGER_CLIENT_ID: api_swagger_monitoring
      SWAGGER_AUTHORIZATION_URL: http://91.227.18.176/identity/connect/authorize
      SWAGGER_TOKEN_URL: http://91.227.18.176/identity/connect/token
      SWAGGER_OAUTH2_REDIRECT_URL: http://91.227.18.176/monitoring/swagger-ui/oauth2-redirect.html
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:8086:8086"
    restart: unless-stopped
    mem_limit: 350m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  patterns-gateway:
    image: ghcr.io/pineapplleboy/hits-patterns-patterns-gateway:latest
    container_name: patterns-gateway
    depends_on:
      - identity-server
      - patterns-users
      - patterns-user-setting
      - account-service
      - credit-service
      - transfers-service
      - currency-service
      - monitoring-service
    environment:
      SERVICES_IDENTITY_SERVER_URL: http://identity-server:5001
      SERVICES_PATTERNS_USERS_URL: http://patterns-users:8080
      SERVICES_PATTERNS_USER_SETTING_URL: http://patterns-user-setting:8080
      SERVICES_ACCOUNT_SERVICE_URL: http://account-service:8082
      SERVICES_CREDIT_SERVICE_URL: http://credit-service:8081
      SERVICES_TRANSFERS_SERVICE_URL: http://transfers-service:8083
      SERVICES_CURRENCY_SERVICE_URL: http://currency-service:8084
      SERVICES_MONITORING_SERVICE_URL: http://monitoring-service:8086
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:8085:8085"
    restart: unless-stopped
    mem_limit: 320m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
