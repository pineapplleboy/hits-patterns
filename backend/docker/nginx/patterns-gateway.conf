upstream patterns_gateway {
    server 127.0.0.1:8085;
    keepalive 32;
}

upstream identity_server_direct {
    server 127.0.0.1:5001;
    keepalive 16;
}

upstream patterns_users_direct {
    server 127.0.0.1:5229;
    keepalive 16;
}

upstream patterns_user_setting_direct {
    server 127.0.0.1:5176;
    keepalive 16;
}

upstream account_service_direct {
    server 127.0.0.1:8082;
    keepalive 16;
}

upstream credit_service_direct {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream transfers_service_direct {
    server 127.0.0.1:8083;
    keepalive 16;
}

upstream currency_service_direct {
    server 127.0.0.1:8084;
    keepalive 16;
}

upstream monitoring_service_direct {
    server 127.0.0.1:8086;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name 91.227.18.176;

    client_max_body_size 20m;

    location = /gateway {
        return 301 /gateway/;
    }

    location /gateway/ {
        proxy_pass http://patterns_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /hits-class/ {
        proxy_pass http://127.0.0.1:8079/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /hits-class;
    }

    location /smc-api/ {
        proxy_pass http://127.0.0.1:8023/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
