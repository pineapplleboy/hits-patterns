spring:
  application:
    name: currency

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

  datasource:
    url: jdbc:postgresql://localhost:5432/patterns_currency
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: 8084
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger
    oauth2-redirect-url: ${SWAGGER_OAUTH2_REDIRECT_URL:http://localhost:8084/swagger/oauth2-redirect.html}
    oauth:
      client-id: ${SWAGGER_CLIENT_ID:api_swagger_currency}
      use-pkce-with-authorization-code-grant: true
      scopes: ${SWAGGER_OAUTH_SCOPES:SampleAPI}
  api-docs:
    path: /v3/api-docs
  cache:
    disabled: true

app:
  security:
    oauth2:
      authorization-url: ${SWAGGER_AUTHORIZATION_URL:https://localhost:5001/connect/authorize}
      token-url: ${SWAGGER_TOKEN_URL:https://localhost:5001/connect/token}
      scope: ${SWAGGER_OAUTH_SCOPE:SampleAPI}
      scope-description: ${SWAGGER_OAUTH_SCOPE_DESCRIPTION:Sample API - full access}

currency:
  list:
    url: https://api.fxratesapi.com/latest
    processed:
      - id: 643
        name: "Российский рубль"
        charCode: RUB
        symbol: ₽
      - id: 840
        name: "Доллар США"
        charCode: USD
        symbol: $
      - id: 156
        name: "Китайский юань"
        charCode: CNY
        symbol: ¥
      - id: 398
        name: "Казахстанский тенге"
        charCode: KZT
        symbol: ₸
      - id: 0
        name: "Биткоин"
        charCode: BTC
        symbol: ₿
